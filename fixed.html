<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>La Bistro Billing</title>
<style>html,body{margin:0;padding:0;background:#fff;min-height:100%}iframe{display:block;width:100%;height:2600px;border:0}</style>
</head>
<body>
<iframe id="pos" src="./index.html?professional=20260925-11"></iframe>
<script>
const f=document.getElementById('pos');
f.addEventListener('load',()=>{
 try{
  const d=f.contentDocument;
  const s=d.createElement('style');
  s.textContent=`
  .top-actions .btn,.top-actions button{background:#17130b!important;color:#fff!important;-webkit-text-fill-color:#fff!important;font-weight:800!important;font-size:16px!important}
  .top-actions .btn.primary{background:linear-gradient(#e8b63e,#a87513)!important;color:#080808!important;-webkit-text-fill-color:#080808!important}
  .print-actions .btn:not(.primary),#whatsappBtn,#whatsappBillBtn{background:#17130b!important;color:#fff!important;-webkit-text-fill-color:#fff!important;font-weight:800!important}
  #gst,#discount{background:#fff!important;color:#111!important;-webkit-text-fill-color:#111!important;font-weight:800!important;border:1px solid #999!important}
  .tabs{display:flex!important;visibility:visible!important}
  .layout{display:grid!important;visibility:visible!important}
  .menu-panel{display:block!important;visibility:visible!important}
  #menuPanel{display:block!important;visibility:visible!important}
  .grid{display:grid!important;grid-template-columns:repeat(4,minmax(145px,1fr))!important;gap:9px!important;overflow-x:auto!important}
  .item{display:block!important;box-sizing:border-box!important;min-height:128px!important;background:#fff!important;color:#111!important;border:1px solid #d6d6d6!important;border-radius:9px!important;padding:9px!important;cursor:pointer!important;touch-action:manipulation!important}
  .item .en{color:#111!important;font-weight:800!important}
  .item .bn{color:#333!important;font-weight:800!important}
  .item .price{color:#111!important;font-weight:900!important}
  .tab{color:#111!important;font-weight:800!important}
  `;
  d.head.appendChild(s);
  if(typeof f.contentWindow.renderTabs==='function')f.contentWindow.renderTabs();
  if(typeof f.contentWindow.renderMenu==='function')f.contentWindow.renderMenu();
 }catch(e){console.log(e)}
});
</script>
</body>
</html>
