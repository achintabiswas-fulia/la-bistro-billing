<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>La Bistro Billing – Fixed</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="./index.html?fixed=20260925-7"></iframe><script>
const css=`
.top-actions .btn,.top-actions button,header .btn,header button{background:#fff!important;background-image:none!important;color:#111!important;-webkit-text-fill-color:#111!important;text-shadow:none!important;border:1px solid #b8953b!important}
.btn.primary,.top-actions .btn.primary{background:#e6b83f!important;background-image:none!important;color:#111!important;-webkit-text-fill-color:#111!important}
.print-actions .btn,.print-actions button,#whatsappBtn,#whatsappBillBtn{background:#fff!important;background-image:none!important;color:#111!important;-webkit-text-fill-color:#111!important}
#gst,#gstInput,input[name="gst"],input.gst,.summary input,.summary select{background:#fff!important;color:#111!important;-webkit-text-fill-color:#111!important;border:1px solid #999!important}
`;
function fix(){const f=document.getElementById('app');try{const d=f.contentDocument||f.contentWindow.document;if(!d||!d.head)return;let s=d.getElementById('external-readable-fix');if(!s){s=d.createElement('style');s.id='external-readable-fix';s.textContent=css;d.head.appendChild(s)}else s.textContent=css}catch(e){}}
const f=document.getElementById('app');f.addEventListener('load',()=>{fix();setTimeout(fix,500);setTimeout(fix,1500)});setInterval(fix,3000);
</script></body></html>
