<html lang="bn"><head><meta charset="utf-8">

<title>La Bistro POS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
:root{--bg:#080808;--gold:#d9a62e;--gold2:#f2c75c;--cream:#fff4cf;--line:#5d4618}
*{box-sizing:border-box}body{margin:0;background:#f7f7f7;color:#111;font-family:'Noto Sans Bengali',Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;display:flex;gap:11px;align-items:center}
.logo{width:65px;height:65px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}.logo-upload{display:block;cursor:pointer;line-height:0}.logo-upload .logo{display:block}.brand h1{font-family:'Playfair Display',serif;color:#111;font-size:25px;margin:0;letter-spacing:1px}.brand div{font-weight:700;font-size:13px;color:#222}
.top-actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}.btn{background:#17130b;color:var(--cream);border:1px solid var(--gold);border-radius:8px;padding:8px 11px;cursor:pointer}.btn.primary{background:linear-gradient(#e8b63e,#a87513);color:#080808;font-weight:700}
.controls{padding:8px 12px;display:flex;gap:7px;flex-wrap:wrap;background:#fff;border-bottom:1px solid #2a2112}.controls input,.controls select{background:#fff;border:1px solid #bbb;color:#111;border-radius:8px;padding:9px}.controls input[type=tel]{min-width:190px}
.tabs{display:flex;gap:6px;overflow:auto;padding:8px 12px;position:sticky;top:83px;z-index:10;background:#fff;border-bottom:1px solid #2a2112}.tab{font-weight:800;white-space:nowrap;background:#fff;border:1px solid #55431e;color:#111;padding:7px 10px;border-radius:20px;cursor:pointer}.tab.active{background:#f3d36a;color:#111;font-weight:700}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:11px;padding:11px;background:#f7f7f7}.menu-panel{min-width:0}.category-title{color:#111;font-weight:800;font-family:'Playfair Display',serif;font-size:21px;border:1px solid #d4b25b;background:#fff8df;padding:8px 10px;margin:9px 0;border-radius:8px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(4,minmax(145px,1fr));gap:9px;overflow-x:auto;padding-bottom:4px}.item{min-height:128px;border:1px solid #d6d6d6;border-radius:9px;background:#fff;padding:8px;cursor:pointer;position:relative;color:#fff;text-align:left}.item:active{transform:scale(.97)}.item:hover{border-color:#111}
.item .en{font-weight:800;font-size:15px;line-height:1.18;overflow-wrap:anywhere;word-break:normal;color:#111}.item .bn{font-weight:700;font-size:14px;color:#333;line-height:1.25;margin-top:5px;overflow-wrap:anywhere;word-break:normal}.item .price{font-size:14px;font-weight:800;position:absolute;right:7px;bottom:6px;color:#111;font-weight:700}.item .qty{position:absolute;left:6px;top:6px;background:#d69f27;color:#090909;border-radius:50%;min-width:23px;height:23px;text-align:center;padding-top:1px;font-weight:800;display:none}.item.selected .qty{display:block}.item.selected{border-color:#d4a72c;box-shadow:0 0 0 2px #e6c76b,0 2px 10px rgba(120,90,0,.12)}\n.item-qty-controls{position:absolute;left:4px;right:4px;top:4px;display:flex;align-items:center;justify-content:space-between;gap:20px;background:transparent;border:0;border-radius:8px;padding:0;z-index:5;color:#111!important}.item-qty-controls span{display:inline-flex;align-items:center;justify-content:center;width:44px;min-width:44px;height:44px;border-radius:8px;border:1px solid #c9a74f;background:#fff;color:#111;font-size:21px;line-height:1;cursor:pointer;touch-action:manipulation}.item-qty-controls .item-plus{margin-left:0}.item-qty-controls b{min-width:32px;height:36px;display:inline-flex;align-items:center;justify-content:center;text-align:center;color:#111;background:#fff;border-radius:6px;font-size:18px;pointer-events:none}
.cart{background:#fff;border:1px solid #c8a94e;border-radius:11px;padding:11px;position:sticky;top:135px;height:calc(100vh - 150px);display:flex;flex-direction:column}.cart h2{margin:0;color:#111;font-family:'Playfair Display',serif}.cart .sub{color:#6b5a32;font-size:12px;margin-bottom:7px}.bill-customer-inputs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:5px 0 7px}.bill-customer-inputs input{width:100%;box-sizing:border-box;background:#fff;border:1px solid #bbb;color:#111;border-radius:7px;padding:8px;font-size:13px}.bill-customer-inputs input::placeholder{color:#777}.cart-items{overflow:auto;flex:1;border-top:1px solid #ddd;border-bottom:1px solid #ddd;padding:4px 0}.bill-head{display:grid;grid-template-columns:42px 1fr 58px 65px;gap:5px;padding:6px 2px;font-size:11px;font-weight:800;border-bottom:1px solid #999}.bill-head span:nth-child(3),.bill-head span:nth-child(4){text-align:right}.bill-line{display:grid;grid-template-columns:42px 1fr 58px 65px;gap:5px;align-items:center}.bill-qty{font-weight:800;text-align:center}.bill-price,.bill-total{text-align:right;font-weight:800}.bill-item{min-width:0}.bill-item .cart-name{font-size:14px}.bill-item .cart-bn{font-size:12px}.cart-row{padding:7px 0;border-bottom:1px dashed #bbb}.cart-name{font-weight:700}.cart-bn{font-size:12px;color:#444}.row-controls{display:flex;align-items:center;gap:5px;margin-top:3px}.small{padding:2px 7px;border-radius:5px;border:1px solid #b8953b;background:#fff;color:#111;cursor:pointer}.amount{margin-left:auto;color:#111;font-weight:700}.summary{padding-top:7px}.sumline{display:flex;justify-content:space-between;padding:3px 0}.total{font-size:21px;color:#111;font-weight:800;border-top:1px solid #604817;margin-top:4px;padding-top:7px}.payments{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.payment{padding:7px;border:1px solid #b8953b;background:#fff;color:#111;border-radius:7px;cursor:pointer}.payment.active{background:#d5a034;color:#080808;font-weight:800}.print-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.print-actions .btn:not(.primary){background:#d9b25f!important;color:#111!important;border:1px solid #c6a24b!important}.notice{font-size:10px;color:#666;line-height:1.3;margin-top:6px}.empty{color:#777;text-align:center;padding:30px 7px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.cart{position:relative;top:auto;height:auto;min-height:380px}.grid{grid-template-columns:repeat(4,minmax(145px,1fr));overflow-x:auto}}
@media(max-width:560px){header{padding:7px}.logo{width:54px;height:54px}.brand h1{font-size:20px}.top-actions .btn{padding:6px 7px;font-size:11px}.grid{grid-template-columns:repeat(4,minmax(145px,1fr));gap:7px;overflow-x:auto}.item{min-height:128px;padding:9px}.item .en{font-size:14px;font-weight:800;line-height:1.2}.item .bn{font-size:13px;font-weight:700;line-height:1.25}.item .price{font-size:13px;font-weight:800}.controls{padding:7px}.layout{padding:7px}}
@media print{body{background:#fff;color:#000}header,.controls,.tabs,.menu-panel,.top-actions,.notice,.payment,.print-actions{display:none!important}.layout{display:block;padding:0}.cart{border:0;height:auto;position:static;color:#000}.cart h2,.cart .sub,.cart-bn,.total,.amount{color:#000}}

/* La Bistro light billing mode */
body,.app{background:#f7f7f7!important;color:#111!important}
header,.controls,.tabs,.cart{background:#fff!important}
.tabs{border-bottom:1px solid #ddd!important}
.item{color:#111!important}
.item .en{color:#111!important}
.item .bn{color:#333!important}
.category-title{background:#fffaf0!important}
.cart h2,.brand h1{color:#111!important}
.sumline,.cart-name{color:#111!important}

/* Final readability override: all menu and billing text is black */
body,.app,header,.controls,.tabs,.layout,.menu-panel,.cart,
.brand,.brand h1,.brand div,.tab,.category-title,.item,.item .en,.item .bn,
.item .price,.cart h2,.cart .sub,.cart-name,.cart-bn,.amount,.sumline,
.total,.payment,.notice,.empty,.small,.controls input,.controls select {
  color:#111 !important;
}
.tab.active { color:#111 !important; background:#f3d36a !important; }
.btn { color:#111 !important; }
.btn.primary { color:#111 !important; }

/* Extra readable menu typography */
.item .en { font-size:15px !important; line-height:1.18 !important; overflow-wrap:anywhere; font-weight:800 !important; color:#111 !important; }
.item .bn { font-size:14px !important; line-height:1.25 !important; overflow-wrap:anywhere; font-weight:700 !important; color:#111 !important; }
.item .price { font-size:14px !important; font-weight:800 !important; color:#111 !important; }
.category-title { font-size:21px !important; font-weight:800 !important; color:#111 !important; }
.tab { font-size:14px !important; font-weight:800 !important; color:#111 !important; }

<body>
<header><label class="logo-upload" for="logoPicker" title="Tap to change logo / লোগো পরিবর্তন করতে ট্যাপ করুন"><img class="logo" style="cursor:pointer" src="la-bistro-logo.svg"></label><div class="brand"><h1>LA BISTRO</h1><div>Multi Cuisine Family Restaurant • লা বিস্ট্রো</div></div><div class="top-actions"><button class="btn" onclick="newBill()">New Bill / নতুন বিল</button><button class="btn" onclick="openLogoPicker()">Logo / লোগো</button><button class="btn" onclick="window.print()">Print / প্রিন্ট</button></div></header>
<div class="controls"><select id="orderType"><option>Dine-in / ডাইন-ইন</option><option>Takeaway / টেকঅ্যাওয়ে</option><option>Delivery / ডেলিভারি</option></select><input id="table" placeholder="Table / টেবিল"><input id="search" placeholder="Search / খুঁজুন" oninput="renderMenu()"></div>

<div class="tabs" id="tabs"></div>

nd:#d9b25f!important;color:#111!important;border:2px solid #c6a24b!important;border-radius:8px!important;font-weight:700!important;font-size:16px!important;cursor:pointer!important;opacity:1!important;pointer-events:auto!important;-webkit-appearance:auto!important;appearance:auto!important"></div><img id="billQrPreview" alt="QR Code" style="display:none;max-width:110px;max-height:110px;margin:4px auto 8px;object-fit:contain"><label style="display:block;font-weight:700;margin-bottom:5px">Customer Message / কাস্টমার মেসেজ</label><textarea id="billCustomerMessage" rows="2" placeholder="Write customer message / কাস্টমার মেসেজ লিখুন" style="width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:7px;resize:vertical"></textarea></div><div class="print-actions"><button class="btn primary" onclick="printReceipt()">PRINT BILL / বিল প্রিন্ট</button><button class="btn" onclick="sendWhatsAppBill()">WHATSAPP BILL / হোয়াটসঅ্যাপ বিল</button><button class="btn" onclick="bluetoothPrinter()">BLUETOOTH / ব্লুটুথ</button></div><div class="notice">One tap = quantity 1. Every additional tap increases quantity. Use − in the bill to reduce it.</div></div></aside></div>

function changeLogo(event){
  const file=event.target.files && event.target.files[0];
  if(!file)return;
  if(!file.type || !file.type.startsWith('image/')){
    alert('Please select an image / একটি ছবি নির্বাচন করুন');
    return;
  }
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const max=900, scale=Math.min(1,max/Math.max(img.width,img.height));
      const canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(img.width*scale));
      canvas.height=Math.max(1,Math.round(img.height*scale));
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const data=canvas.toDataURL('image/jpeg',0.82);
      document.querySelector('.logo').src=data;
      try{
        localStorage.setItem('laBistroLogo',data);
        localStorage.setItem('la_bistro_logo',data);
        if(window.lbCloudPush)setTimeout(()=>window.lbCloudPush(),100);
        alert('Logo updated / লোগো পরিবর্তন হয়েছে');
      }catch(err){
        alert('Logo is too large for this phone browser. Please choose a smaller image / লোগোটি খুব বড়। ছোট ছবি নির্বাচন করুন');
      }
    };
    img.onerror=function(){alert('Could not read this image / ছবিটি পড়া যাচ্ছে না');};
    img.src=e.target.result;
  };
  reader.onerror=function(){alert('Could not open this image / ছবিটি খোলা যাচ্ছে না');};
  reader.readAsDataURL(file);
}
